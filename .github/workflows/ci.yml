name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
# The ref has to be interpolated: a bare "ci-$" is a single literal group shared
# by every branch, so any push would cancel unrelated runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Least privilege, declared rather than inherited: this job only reads the
    # tree. It needs no token write access of any kind, and nothing here
    # publishes. The release job in semantic-release.yml is the only one that
    # asks for more, and it asks only for `id-token: write` to mint the OIDC
    # token for npm provenance.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      # Routing tests against the real n8n declarative router, and the
      # description-level smoke checks. Both build first; neither needs
      # credentials or network access. Live API checks are deliberately not run
      # here — see scripts/live.mjs.
      - name: Run tests
        run: 'npm test'

      - name: Run smoke checks
        run: 'npm run smoke'
