name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
# The ref has to be interpolated: a bare "ci-$" is a single literal group shared
# by every branch, so any push would cancel unrelated runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Least privilege, declared rather than inherited: this job only reads the
    # tree. It needs no token write access of any kind, and nothing here
    # publishes. The release job in release.yml is the only one that asks for
    # more, and it asks only for `id-token: write` to mint the OIDC token for
    # npm provenance.
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # semantic-release walks the full history to find the last release.
          # A shallow clone makes it think every commit is new.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci --no-fund --no-audit'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      # Routing tests against the real n8n declarative router, and the
      # description-level smoke checks. Both build first; neither needs
      # credentials or network access. Live API checks are deliberately not run
      # here — see scripts/live.mjs.
      - name: Run tests
        run: 'npm test'

      - name: Run smoke checks
        run: 'npm run smoke'
