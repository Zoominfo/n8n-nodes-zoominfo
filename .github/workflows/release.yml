# Publishes @zoominfo/n8n-nodes-zoominfo to npm with semantic-release.
#
# Mirrors the release setup already in use at Zoominfo/gtm-ai-cli, which
# publishes @zoominfo/gtm-ai-cli to npm with provenance from this same
# organisation.
#
# ─── HOW A RELEASE HAPPENS ─────────────────────────────────────────────────────
#
# Manually: Actions -> Release -> Run workflow. There is no tag or
# version to pick. semantic-release reads the Conventional Commit messages since
# the last release, decides the version itself, and does nothing at all if no
# commit warrants one.
#
#   fix: ...              -> patch   (1.0.0 -> 1.0.1)
#   feat: ...             -> minor   (1.0.0 -> 1.1.0)
#   BREAKING CHANGE: ...  -> major   (1.0.0 -> 2.0.0)
#   chore:, refactor:, test:, ci:   -> no release
#
# Commits that do not follow the convention are invisible to the version
# calculation. A release run over only non-conventional commits exits with
# "no release published" and changes nothing, which is a safe no-op rather than
# a failure.
#
# ─── WHAT IT DOES ──────────────────────────────────────────────────────────────
#
#   1. lint and build, so a broken tree cannot reach npm
#   2. bump the version and `npm publish` with an OIDC provenance attestation
#   3. commit the bumped package.json + lockfile back to main and tag it
#   4. create the GitHub Release, with notes generated from the commits
#
# CHANGELOG.md is deliberately *not* managed here. There is no changelog plugin
# configured, so the hand-written file is left alone — update it by hand in the
# same PR as the change it describes.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# npm trusted publishing, configured once against this repository:
#
#   npm login                              # a ZoomInfo-owned npm account
#   npm trust github --file release.yml
#
# There is deliberately no NPM_TOKEN. Publishing authenticates over OIDC, so no
# long-lived npm credential is stored in this repository at all. `id-token:
# write` below is what mints the short-lived token, and it is also what produces
# the provenance attestation that n8n requires for verified community nodes.
#
# The GitHub App credentials (HOMEBREW_CLIENT_ID / HOMEBREW_PRIVATE_KEY) are the
# same pair gtm-ai-cli uses. They exist because step 3 pushes a commit back to
# main: the default GITHUB_TOKEN cannot push to a protected branch, and commits
# it makes do not trigger downstream workflows.

name: Release

on:
  workflow_dispatch:

jobs:
  publish-version:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token used for npm authentication and for the provenance
      # attestation. Every other operation here — the push back to main, the
      # GitHub Release — runs as the App token below, not as GITHUB_TOKEN, so no
      # other scope is granted.
      id-token: write

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.HOMEBREW_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # semantic-release walks the full history to find the last release.
          # A shallow clone makes it think every commit is new.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      # Trusted publishing requires npm >= 11.5.1. The npm bundled with Node 24
      # satisfies that today, but pinning the upgrade means a change to the
      # bundled version cannot break publishing with an auth error that looks
      # unrelated to Node.
      - name: Ensure npm supports trusted publishing
        run: 'npm install -g npm@latest'

      - name: Install dependencies
        run: 'npm ci --no-fund --no-audit'

      # Ahead of semantic-release rather than inside it: nothing should reach
      # npm from a tree that does not lint and build. `npm run build` also
      # populates dist/, which is the only thing `files` publishes.
      - name: Lint
        run: 'npm run lint'

      - name: Build
        run: 'npm run build'

      - name: Test
        run: 'npm test'

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: zoominfo-bot
          GIT_AUTHOR_EMAIL: zoominfo-bot@zoominfo.com
          GIT_COMMITTER_NAME: zoominfo-bot
          GIT_COMMITTER_EMAIL: zoominfo-bot@zoominfo.com
          # `prepublishOnly` runs `n8n-node prerelease`, which exits non-zero
          # unless this is set. The guard exists to stop a stray local
          # `npm publish`; this is the one place a publish is legitimate.
          RELEASE_MODE: 'true'
        run: 'npx semantic-release@25'
